{% extends 'base.html' %}{% block content %}<section class="form-card"><p class="eyebrow">New service request</p><h1>What needs attention?</h1><p>Describe the problem in your own words. You can choose a category or let the system suggest one.</p><form method="post"><label>Problem description<textarea name="description" rows="5" minlength="8" maxlength="1000" required>{{ description or '' }}</textarea></label><label>Service category<select name="category"><option value="">Suggest a category for me</option>{% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></label><label>Item or equipment details<input name="item_details" placeholder="Example: Samsung washing machine"></label><label>Service area<input name="service_area" placeholder="City or locality"></label><button>Submit request</button></form></section>{% endblock %}
