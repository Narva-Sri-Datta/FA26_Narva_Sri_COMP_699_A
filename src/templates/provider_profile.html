{% extends 'base.html' %}{% block content %}<section class="form-card"><h1>Provider profile</h1><p class="hint">Your account must be approved by an administrator before customers can send requests.</p><form method="post"><label>Business name<input name="business_name" value="{{ profile.business_name }}" required></label><label>Service area<input name="service_area" value="{{ profile.service_area }}" required></label><label>About your service<textarea name="bio" rows="3">{{ profile.bio }}</textarea></label><label>Availability<select name="availability"><option {{ 'selected' if profile.availability=='Available' }}>Available</option><option {{ 'selected' if profile.availability=='Unavailable' }}>Unavailable</option></select></label><fieldset><legend>Service categories</legend>{% for c in categories %}<label class="check"><input type="checkbox" name="categories" value="{{ c }}" {{ 'checked' if c in selected else '' }}> {{ c }}</label>{% endfor %}</fieldset><button>Save profile</button></form></section>{% endblock %}
