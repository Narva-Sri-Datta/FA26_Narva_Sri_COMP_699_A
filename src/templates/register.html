{% extends 'base.html' %}{% block content %}<section class="form-card"><h1>Create an account</h1><form method="post"><label>Full name<input name="name" required maxlength="100"></label><label>Email<input type="email" name="email" required></label><label>Phone<input name="phone" required></label><label>Password<input type="password" name="password" minlength="8" required></label><label>Account type<select name="role"><option value="user">Local user</option><option value="provider">Service provider</option></select></label><p class="hint">For a provider account, also complete the business details below.</p><label>Business name<input name="business_name"></label><label>Service area<input name="service_area" placeholder="City or service area"></label><label>About your service<textarea name="bio" rows="3"></textarea></label><button>Create account</button></form></section>{% endblock %}
