<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Local Service System{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a href="{{ url_for('index') }}">Local Service Problem Diagnosis and Matching System</a>
<nav><a href="{{ url_for('new_request') }}">New request</a><a href="{{ url_for('requests_page') }}">Requests</a></nav></header>
<main class="container">{% for category, message in get_flashed_messages(with_categories=true) %}
<p class="flash {{ category }}">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
